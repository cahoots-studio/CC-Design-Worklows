<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Slider</title>

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="vendor/swiper.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #dce8d7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    /* ── Section ── */
    .team-section {
      width: 100%;
      padding: 80px 0 60px;
      overflow: hidden;
    }

    .team-section__heading {
      text-align: center;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 28px;
      letter-spacing: -0.5px;
      color: #1a2e1a;
      margin-bottom: 56px;
      padding: 0 40px;
    }

    /* ── Swiper container ── */
    .team-swiper {
      width: 100%;
      /* overflow visible so scaled slides bleed naturally into each other */
      overflow: visible;
    }

    /* Clip horizontally only — overflow-x:clip doesn't create a block formatting
       context so children can still overflow vertically (bio below photos). */
    .team-swiper-outer {
      width: 100%;
      overflow-x: clip;
      overflow-y: visible;
    }

    /* ── Slide base ── */
    .swiper-slide {
      width: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      /* opacity on inactive handled via JS coverflow scale */
      transition: opacity 0.4s ease;
      cursor: pointer;
    }

    .swiper-slide-active {
      cursor: default;
    }

    /* Fade bio and accent on inactive — JS setTranslate handles scale */
    .swiper-slide:not(.swiper-slide-active) {
      opacity: 0.45;
    }

    .swiper-slide-active {
      opacity: 1;
    }

    /* ── Photo wrapper ── */
    .team-card__image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
    }

    /* Green accent square — only shown on active slide */
    .team-card__accent {
      position: absolute;
      width: 52%;
      aspect-ratio: 1;
      background: #3d6b46;
      bottom: -8px;
      left: -10px;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .swiper-slide-active .team-card__accent {
      opacity: 1;
    }

    .team-card__photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      z-index: 1;
    }

    /* CSS-only photo placeholders when no real image is present */
    .team-card__photo--p1 { background: linear-gradient(160deg, #b0c4ae 0%, #7a9e85 100%); }
    .team-card__photo--p2 { background: linear-gradient(160deg, #c4b8ae 0%, #9e8a7a 100%); }
    .team-card__photo--p3 { background: linear-gradient(160deg, #aeb8c4 0%, #7a859e 100%); }
    .team-card__photo--p4 { background: linear-gradient(160deg, #c4aebc 0%, #9e7a94 100%); }
    .team-card__photo--p5 { background: linear-gradient(160deg, #c4c4ae 0%, #9e9e7a 100%); }

    /* ── Bio ── */
    .team-card__bio {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease 0.1s, visibility 0.3s ease 0.1s;
    }

    .swiper-slide-active .team-card__bio {
      opacity: 1;
      visibility: visible;
    }

    .team-card__name {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: 22px;
      color: #1a2e1a;
      line-height: 1.2;
    }

    .team-card__role {
      font-size: 13px;
      font-weight: 400;
      color: #3d5c3d;
      letter-spacing: 0.01em;
    }

    .team-card__linkedin {
      display: inline-flex;
      align-items: center;
      margin-top: 6px;
      color: #0a66c2;
      text-decoration: none;
    }

    .team-card__linkedin svg {
      width: 20px;
      height: 20px;
    }

    /* ── Controls ── */
    .team-swiper-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 40px;
    }

    /* Nav buttons — force static so Swiper can't make them absolute */
    .team-swiper-prev,
    .team-swiper-next {
      position: static !important;
      top: auto !important;
      left: auto !important;
      right: auto !important;
      bottom: auto !important;
      width: 40px !important;
      height: 40px !important;
      border-radius: 50%;
      border: 1.5px solid #1a2e1a;
      background: transparent;
      display: flex !important;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin: 0 !important;
      flex-shrink: 0;
    }

    .team-swiper-prev:hover,
    .team-swiper-next:hover {
      background: #1a2e1a;
    }

    .team-swiper-prev:hover svg,
    .team-swiper-next:hover svg {
      stroke: #dce8d7;
    }

    .team-swiper-prev svg,
    .team-swiper-next svg {
      width: 16px;
      height: 16px;
      stroke: #1a2e1a;
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.2s;
    }

    /* Override Swiper default button positioning */
    .team-swiper-prev::after,
    .team-swiper-next::after {
      display: none;
    }

    /* Pagination — override Swiper's absolute/width:100% defaults */
    .team-swiper-pagination {
      position: static !important;
      width: auto !important;
      display: flex !important;
      align-items: center;
      gap: 6px;
      bottom: auto !important;
      left: auto !important;
    }

    .team-swiper-pagination .swiper-pagination-bullet {
      width: 7px;
      height: 7px;
      background: #1a2e1a;
      opacity: 0.25;
      margin: 0 !important;
      transition: opacity 0.2s, transform 0.2s;
    }

    .team-swiper-pagination .swiper-pagination-bullet-active {
      opacity: 1;
      transform: scale(1.25);
    }
  </style>
</head>
<body>

  <section class="team-section">
    <h2 class="team-section__heading">Every move, intentional</h2>

    <div class="team-swiper-outer">
      <div class="swiper team-swiper">
        <div class="swiper-wrapper">

          <!-- Slide 1 -->
          <div class="swiper-slide">
            <div class="team-card__image-wrapper">
              <div class="team-card__accent"></div>
              <div class="team-card__photo team-card__photo--p1"></div>
            </div>
            <div class="team-card__bio">
              <h3 class="team-card__name">Tim Williamson</h3>
              <p class="team-card__role">Founder / CEO</p>
              <a href="#" class="team-card__linkedin" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.45 20.45h-3.554v-5.57c0-1.328-.024-3.037-1.851-3.037-1.853 0-2.136 1.446-2.136 2.94v5.667H9.356V9h3.414v1.561h.048c.476-.9 1.637-1.85 3.368-1.85 3.6 0 4.265 2.37 4.265 5.455v6.284zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
              </a>
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="swiper-slide">
            <div class="team-card__image-wrapper">
              <div class="team-card__accent"></div>
              <div class="team-card__photo team-card__photo--p2"></div>
            </div>
            <div class="team-card__bio">
              <h3 class="team-card__name">Sarah Chen</h3>
              <p class="team-card__role">Head of Strategy</p>
              <a href="#" class="team-card__linkedin" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.45 20.45h-3.554v-5.57c0-1.328-.024-3.037-1.851-3.037-1.853 0-2.136 1.446-2.136 2.94v5.667H9.356V9h3.414v1.561h.048c.476-.9 1.637-1.85 3.368-1.85 3.6 0 4.265 2.37 4.265 5.455v6.284zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
              </a>
            </div>
          </div>

          <!-- Slide 3 -->
          <div class="swiper-slide">
            <div class="team-card__image-wrapper">
              <div class="team-card__accent"></div>
              <div class="team-card__photo team-card__photo--p3"></div>
            </div>
            <div class="team-card__bio">
              <h3 class="team-card__name">Marcus Rivera</h3>
              <p class="team-card__role">Lead Designer</p>
              <a href="#" class="team-card__linkedin" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.45 20.45h-3.554v-5.57c0-1.328-.024-3.037-1.851-3.037-1.853 0-2.136 1.446-2.136 2.94v5.667H9.356V9h3.414v1.561h.048c.476-.9 1.637-1.85 3.368-1.85 3.6 0 4.265 2.37 4.265 5.455v6.284zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
              </a>
            </div>
          </div>

          <!-- Slide 4 -->
          <div class="swiper-slide">
            <div class="team-card__image-wrapper">
              <div class="team-card__accent"></div>
              <div class="team-card__photo team-card__photo--p4"></div>
            </div>
            <div class="team-card__bio">
              <h3 class="team-card__name">Priya Patel</h3>
              <p class="team-card__role">Growth Director</p>
              <a href="#" class="team-card__linkedin" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.45 20.45h-3.554v-5.57c0-1.328-.024-3.037-1.851-3.037-1.853 0-2.136 1.446-2.136 2.94v5.667H9.356V9h3.414v1.561h.048c.476-.9 1.637-1.85 3.368-1.85 3.6 0 4.265 2.37 4.265 5.455v6.284zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
              </a>
            </div>
          </div>

          <!-- Slide 5 -->
          <div class="swiper-slide">
            <div class="team-card__image-wrapper">
              <div class="team-card__accent"></div>
              <div class="team-card__photo team-card__photo--p5"></div>
            </div>
            <div class="team-card__bio">
              <h3 class="team-card__name">James Okafor</h3>
              <p class="team-card__role">Operations Lead</p>
              <a href="#" class="team-card__linkedin" aria-label="LinkedIn">
                <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20.45 20.45h-3.554v-5.57c0-1.328-.024-3.037-1.851-3.037-1.853 0-2.136 1.446-2.136 2.94v5.667H9.356V9h3.414v1.561h.048c.476-.9 1.637-1.85 3.368-1.85 3.6 0 4.265 2.37 4.265 5.455v6.284zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                </svg>
              </a>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- Controls: prev | dots | next -->
    <div class="team-swiper-controls">
      <div class="team-swiper-prev">
        <svg viewBox="0 0 16 16"><polyline points="10,2 4,8 10,14"/></svg>
      </div>
      <div class="team-swiper-pagination"></div>
      <div class="team-swiper-next">
        <svg viewBox="0 0 16 16"><polyline points="6,2 12,8 6,14"/></svg>
      </div>
    </div>
  </section>

  <!-- Swiper JS -->
  <script src="vendor/swiper.min.js"></script>
  <script>
    // Swiper 12 uses translate-jump loop (no DOM clones), which means the active
    // slide always starts at DOM position 0 with nothing to its left on first render.
    // Fix: clone slides before init so real content exists on both sides.
    const COUNT = 5;
    const wrapper = document.querySelector('.swiper-wrapper');
    const originals = [...wrapper.children];
    // Append a copy after the originals
    originals.forEach(s => wrapper.appendChild(s.cloneNode(true)));
    // Prepend a copy before — forEach prepend reverses, so iterate in reverse to keep order
    [...originals].reverse().forEach(s => wrapper.prepend(s.cloneNode(true)));
    // DOM is now: [5 clones in order][5 originals][5 clones in order] = 15 slides
    // initialSlide: COUNT + 2 = slide index 7 (Marcus Rivera in middle set)

    // ── Custom 5-dot pagination (built before Swiper init) ──────────────────
    const paginationEl = document.querySelector('.team-swiper-pagination');

    function updateDots(activeIndex) {
      const realDot = ((activeIndex % COUNT) + COUNT) % COUNT;
      paginationEl.querySelectorAll('.swiper-pagination-bullet').forEach((dot, i) => {
        dot.classList.toggle('swiper-pagination-bullet-active', i === realDot);
      });
    }

    for (let i = 0; i < COUNT; i++) {
      const dot = document.createElement('span');
      dot.className = 'swiper-pagination-bullet';
      dot.addEventListener('click', () => {
        const base = Math.floor(teamSwiper.activeIndex / COUNT) * COUNT;
        const target = base + i;
        const clamped = Math.max(COUNT, Math.min(COUNT * 2 - 1, target));
        teamSwiper.slideTo(clamped);
      });
      paginationEl.appendChild(dot);
    }

    const teamSwiper = new Swiper('.team-swiper', {
      slidesPerView: 'auto',
      centeredSlides: true,
      loop: false,
      initialSlide: COUNT + 2,
      speed: 500,
      spaceBetween: 20,
      watchSlidesProgress: true,

      on: {
        setTranslate(swiper) {
          swiper.slides.forEach((slide) => {
            const p = slide.progress || 0;
            const scale = 1 - Math.min(Math.abs(p), 1) * 0.33;
            slide.style.transform = `scale(${scale})`;
          });
        },
        setTransition(swiper, duration) {
          swiper.slides.forEach(slide => {
            slide.style.transition = `transform ${duration}ms ease`;
          });
        },
        slideChange(swiper) {
          // Seamless wrap: jump to equivalent slide in the middle set
          const idx = swiper.activeIndex;
          if (idx >= COUNT * 2) {
            swiper.slideTo(idx - COUNT, 0, false);
          } else if (idx < COUNT) {
            swiper.slideTo(idx + COUNT, 0, false);
          }
          updateDots(swiper.activeIndex);
        },
        init(swiper) {
          updateDots(swiper.activeIndex);
        }
      },
    });

    // Wire nav buttons manually
    document.querySelector('.team-swiper-prev').addEventListener('click', () => teamSwiper.slidePrev());
    document.querySelector('.team-swiper-next').addEventListener('click', () => teamSwiper.slideNext());
  </script>

</body>
</html>
